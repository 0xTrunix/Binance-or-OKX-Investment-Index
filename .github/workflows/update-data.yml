name: Update crypto data

on:
  schedule:
    # Runs every two days at 10:10 Asia/Shanghai.
    - cron: "10 2 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-crypto-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh data
        run: npm run update:data

      - name: Validate generated data
        run: npm run check

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets-data.json spot-assets-data.json cg_yzi_api.json cg_okx_api.json coingecko-binance-ids.json
          git commit -m "Auto update crypto data"
          git push
